<!DOCTYPE html>
<html>
<head>
<title>Portfolio Contact</title>

<style>

body{
font-family: 'Poppins', sans-serif;
background:#f4f6ff;
margin:0;
padding:0;
}

.contact-section{
width:100%;
padding:60px 0;
text-align:center;
}

.contact-section h1{
color:#6C63FF;
font-size:40px;
margin-bottom:10px;
}

.contact-section p{
color:#555;
margin-bottom:40px;
}

.contact-container{
width:70%;
margin:auto;
display:flex;
justify-content:space-between;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

.contact-info{
width:40%;
text-align:left;
}

.contact-info h3{
color:#6C63FF;
margin-bottom:20px;
}

.contact-info p{
margin:10px 0;
font-size:16px;
}

.contact-form{
width:55%;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

.contact-form textarea{
height:120px;
}

.contact-form button{
background:#6C63FF;
color:white;
border:none;
padding:12px 25px;
font-size:16px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

.contact-form button:hover{
background:#4a42d4;
}

.social-icons{
margin-top:20px;
}

.social-icons a{
text-decoration:none;
margin-right:10px;
font-size:18px;
color:#6C63FF;
}

</style>

</head>

<body>

<section class="contact-section">

<h1>Contact Me</h1>
<p>Let's work together and build something amazing</p>

<div class="contact-container">

<div class="contact-info">

<h3>Get In Touch</h3>

<p>📧 Email: shazmeenrazzaq@email.com</p>
<p>📞 Phone: +92 3XX0- XXXXXXX</p>
<p>📍 Location: Multan, Pakistan</p>

<div class="social-icons">
<a href="#">LinkedIn</a>
<a href="#">GitHub</a>
<a href="#">Instagram</a>
</div>

</div>

<div class="contact-form">

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="text" placeholder="Subject">

<textarea placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

</section>

</body>
</html>
